name: Recherche Radar Import
run-name: ${{ github.event.inputs.mode == 'perso' && 'perso' || 'scan' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan (recherche complète) ou perso (recherche personnalisée)"
        required: false
        default: "scan"
      params:
        description: "Paramètres de la recherche personnalisée (JSON)"
        required: false
        default: "{}"
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi, 7 h (heure de Paris en été)
concurrency:
  group: ${{ github.event.inputs.mode == 'perso' && format('perso-{0}', github.run_id) || 'scan' }}
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Récupération du moteur (stockage Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS --fail -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/1b3e436c0be045b8be086976ec340618/values/code" -o code.json
          python3 -c "import json,os;[open(k,'w').write(v) for k,v in json.load(open('code.json')).items()]"
      - name: Recherche
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ github.event.inputs.mode || 'scan' }}
          PARAMS: ${{ github.event.inputs.params || '{}' }}
        run: python3 run.py

